[project]
name = "agentic-planner-core"
version = "0.1.0"
description = "Autonomous planning and issue refinement orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "deepagents>=0.6.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.16.6",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "pip-audit>=2.0.0",
    "pre-commit",
    "tomli-w>=1.0.0",
    "types-requests",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planner", "planner.eval"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
disable_error_code = ["call-arg", "dict-item", "assignment"]

[tool.ruff.lint]
# Freeze the ruff <=0.15 default rule set. Ruff 0.16.0 expanded the default
# rules from 59 to 413 (I001/UP/BLE/... now fire repo-wide); adopting them
# is a dedicated migration, not part of the toolkit consumption (ADR-0022).
# The toolkit-pinned CI ruff (0.16.6) reads this config, so local and CI
# stay in agreement.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
omit = [
    "planner/__main__.py",
    "planner/cli_planning.py",
]

