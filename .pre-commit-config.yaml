# Quality gates — fast ADVISORY layer for the agent commit loop (ADR-0022).
# The binding, toolkit-pinned gate layer is CI
# (.github/workflows/pr-checks.yml, python-checks composite @v1.7.0); the
# pinned CI mypy is authoritative (toolkit D-0012), the `mypy` hook below
# runs advisory in the consumer environment. The toolkit ships no ruff
# hook — the astral rev is consumer-owned and kept in lockstep with the
# toolkit-pinned CI ruff (0.16.6; unchanged at toolkit v1.7.0).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/LuisArteaga/quality-gates-toolkit
    rev: v1.7.0
    hooks:
      - id: secret-scan
      # Consumer-owned mypy from this project's environment (toolkit D-0016):
      # advisory layer — the pinned CI mypy (2.3.1) is authoritative. Target
      # paths are supplied via args (toolkit README hook contract).
      - id: mypy
        args: [planner, tests, scripts]
      # The toolkit hook runs `semgrep scan` in an isolated pinned env
      # (pass_filenames: false, always_run); scope the advisory scan to the
      # source tree like the previous local definition.
      - id: semgrep
        args: ['--config=p/security-audit', '--jobs=0', '--skip-unknown-extensions', '--quiet', 'planner', 'tests', 'scripts']
      - id: pip-audit
        args: ["."]
