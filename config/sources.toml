strict = true
urls = []
domains = [
    "arxiv.org",
    "dl.acm.org",
    "pypi.org",
    "npmjs.com",
    "python.langchain.com",
    "langgraph.org",
    "openrouter.ai",
    "github.com",
]

[search]
engine = "exa"
search_context_size = "medium"
max_results = 10
max_total_results = 15
excluded_domains = ["reddit.com", "stackoverflow.com"]

# Zero-Trust Prompt-Injection Defense (ADR-0020).
# Defense ranking: strict source allowlist (above) + LLM Security Judge +
# HITL publish gate are PRIMARY; sanitize_inputs (regex) is a best-effort
# pre-filter only. audit_level: "off" | "normal" | "strict".
[security]
sanitize_inputs = true
audit_level = "strict"
require_approval = true
max_security_retries = 2
