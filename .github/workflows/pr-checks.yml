name: PR checks

# Composite quality gates from quality-gates-toolkit v1.7.0 (ADR-0022,
# retargeted v1.6.0 -> v1.7.0): the per-language `python-checks.yml`
# composite (toolkit D-0020) gives this Python-only repository one-call
# ergonomics with zero Skipped entries for the JS gates. The toolkit owns
# the toolchain pins (ruff 0.16.6, mypy 2.3.1, semgrep 1.177.0, pip-audit
# 2.10.1) and the gate ordering (toolkit D-0001: deterministic gates
# before the LLM judges). Judge models resolve solely from
# `config/factory.json` (`ci_cd_pr_judges`); `vars.REVIEW_MODEL` and
# env overrides are gone (documented exceptions only).
#
# On workflow_dispatch runs the LLM-review job shows as skipped by design
# (toolkit D-0011): the judges only run on pull_request events.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  pr-checks:
    # A called workflow may only narrow the token granted by this job, and
    # the escalation check runs statically BEFORE any job starts — even for
    # jobs the composite would skip via `if`. The composite's llmreview job
    # declares pull-requests: write, and this repository's default workflow
    # token is read-only, so this call must grant it or the whole run dies
    # as startup_failure.
    permissions:
      contents: read
      pull-requests: write
    uses: LuisArteaga/quality-gates-toolkit/.github/workflows/python-checks.yml@v1.7.0
    with:
      python-version: "3.12"
      # Deterministic gates: lint/typecheck/semgrep over the source tree,
      # coverage measured on the planner package only.
      lint-paths: "planner tests scripts"
      cov-paths: "planner"
      coverage-floor: 80
      # All deterministic gates on; diff-coverage gate enforces 100%
      # changed-line coverage on pull_request events.
      enable-lint: true
      enable-test: true
      enable-security: true
      enable-semgrep: true
      enable-pip-audit: true
      enable-secret-scan: true
      enable-diff-gate: true
      # LLM judges read config/factory.json (toolkit default config-path).
      enable-llm-review: true
      toolkit-ref: v1.7.0
    secrets:
      openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
      judge-token: ${{ secrets.GH_PAT }}
