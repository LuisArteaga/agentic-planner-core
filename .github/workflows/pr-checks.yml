name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  AGENT_MODE: ci
  REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'moonshotai/kimi-k2.7-code' }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OpenRouter API key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "[ERR] OPENROUTER_API_KEY secret not configured."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run secret scan
        run: python3 scripts/secret_scan.py

      - name: Run Ruff Lint & Format Checks
        run: |
          ruff check planner tests scripts
          ruff format --check planner tests scripts

      - name: Run Mypy Typecheck
        run: mypy planner tests scripts

      - name: Run Pytest Coverage Check
        run: pytest --cov=planner --cov-fail-under=80

      - name: Run Semgrep Security Scan
        run: pipx run semgrep --config=auto --error --skip-private-keys-under-limits

      - name: Run Pip-Audit Dependency Check
        run: pip-audit .

      - name: Run LLM review
        run: git diff origin/main...HEAD | scripts/review.sh

