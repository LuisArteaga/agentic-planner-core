name: Issue schema enforcement

# Server-side enforcement of the `Task` issue template (issue #39).
# GitHub Issue Forms only enforce their schema in the web UI; this workflow
# restores the contract for issues created via the REST API or external clients.

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Serialize per-issue runs so rapid edits cannot race.
concurrency:
  group: issue-schema-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate issue schema
    runs-on: ubuntu-latest
    # LOOP-PREVENTION INVARIANT:
    # This workflow NEVER edits an issue's body or title. It only comments,
    # labels, and closes/reopens. Those operations fire `issue_comment`,
    # `labeled`, and `closed`/`reopened` events — none of which this workflow
    # listens to (`opened`, `edited`, `reopened`). Because it never produces an
    # `edited` event, it cannot re-trigger itself. Do not add a step that
    # edits the issue body or title without revisiting this invariant.
    #
    # POLICY IS PURE PYTHON:
    # All conditional enforcement logic lives in planner/issue_schema.py
    # (`decide_enforcement`) and is unit-tested in tests/test_issue_schema.py.
    # The shell below is a thin dispatcher: it collects inputs, runs the
    # validator, sources the emitted `ENFORCE_*` action script, and applies
    # it via `gh`. Keep this shell free of policy branching so coverage of
    # the policy stays in the Python tests.
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Write issue body to file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.md

      - name: Inspect issue state and labels
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          state=$(gh issue view "$ISSUE_NUMBER" --json state -q .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if gh issue view "$ISSUE_NUMBER" --json labels -q '.labels[].name' | grep -qx invalid; then
            echo "has_invalid=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_invalid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate issue body and decide enforcement action
        id: validate
        env:
          ISSUE_STATE: ${{ steps.issue.outputs.state }}
          HAS_INVALID: ${{ steps.issue.outputs.has_invalid }}
        run: |
          set +e
          python3 -m planner.issue_schema \
            --template .github/ISSUE_TEMPLATE/task.yml \
            --body-file /tmp/issue_body.md \
            --issue-state "$ISSUE_STATE" \
            --has-invalid-label "$HAS_INVALID" \
            --comment-file /tmp/comment.md \
            --action-script /tmp/action.sh > /tmp/result.json
          code=$?
          echo "valid=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "::group::Validation report"
          cat /tmp/result.json
          echo "::endgroup::"
          echo "::group::Enforcement action"
          cat /tmp/action.sh
          echo "::endgroup::"

      - name: Apply enforcement action
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # shellcheck disable=SC1091
          source /tmp/action.sh

          # Ensure the `invalid` label exists before we may add it (idempotent).
          if [ "$ENFORCE_ADD_INVALID" = "true" ]; then
            gh label create invalid \
              --color D73A4A \
              --description "Issue does not conform to the required schema template" \
              2>/dev/null || true
          fi

          [ "$ENFORCE_CLOSE" = "true" ] && gh issue close "$ISSUE_NUMBER" --reason "not planned"
          [ "$ENFORCE_ADD_INVALID" = "true" ] && gh issue edit "$ISSUE_NUMBER" --add-label invalid
          [ "$ENFORCE_REMOVE_INVALID" = "true" ] && gh issue edit "$ISSUE_NUMBER" --remove-label invalid
          [ "$ENFORCE_REOPEN" = "true" ] && gh issue reopen "$ISSUE_NUMBER"

          case "$ENFORCE_COMMENT" in
            rejection)
              gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md
              ;;
            recovery)
              gh issue comment "$ISSUE_NUMBER" --body "Thanks @$ISSUE_AUTHOR — this issue now conforms to the required schema. Reopening ✅"
              ;;
          esac
